<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Tiga Tahap Pengerjaan NFShark</title><desc id="desc">Peta konsep zigzag dari kiri ke kanan lalu kembali ke kiri: Diskusi, Pratinjau Awal, dan Finalisasi Desain.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#6f9f68" stroke-width="1.5"/></marker><linearGradient id="wash" x1="0" x2="1"><stop stop-color="#f8faf6"/><stop offset="1" stop-color="#eef4ed"/></linearGradient></defs>
<rect width="1200" height="620" rx="28" fill="url(#wash)"/><g fill="none" stroke="#b7cdb3" stroke-width="1.5"><path d="M42 54H1158M42 566H1158"/></g><g fill="#477d43"><path d="M590 38l10 16-10 16-10-16z"/><path d="M590 550l10 16-10 16-10-16z"/></g>
<g fill="none" stroke="#6f9f68" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"><path d="M402 220C520 220 635 350 786 350"/><path d="M798 402C680 402 545 470 412 470"/></g>
<g font-family="Georgia,serif" fill="#172722">
<rect x="70" y="118" width="330" height="205" rx="22" fill="#fff" stroke="#9fbd98" stroke-width="2"/><circle cx="125" cy="174" r="27" fill="#edf5e9" stroke="#9fbd98"/><path d="M115 164h20m-20 10h15m-15 10h18" stroke="#315d36" stroke-width="2.5" stroke-linecap="round"/><text x="165" y="169" font-size="18" fill="#5b8654">01</text><text x="105" y="232" font-size="31" font-weight="bold">Diskusi</text><text x="105" y="270" font-size="15.5"><tspan x="105" dy="0">Membahas kebutuhan, tujuan website,</tspan><tspan x="105" dy="23">referensi desain, dan fitur yang diperlukan.</tspan></text>
<rect x="800" y="250" width="330" height="205" rx="22" fill="#fff" stroke="#9fbd98" stroke-width="2"/><circle cx="855" cy="306" r="27" fill="#edf5e9" stroke="#9fbd98"/><rect x="843" y="295" width="24" height="19" rx="2" stroke="#315d36" stroke-width="2" fill="none"/><path d="M843 301h24" stroke="#315d36" stroke-width="2"/><text x="895" y="301" font-size="18" fill="#5b8654">02</text><text x="835" y="364" font-size="29" font-weight="bold">Pratinjau Awal</text><text x="835" y="402" font-size="14.5"><tspan x="835" dy="0">Menampilkan gambaran awal website</tspan><tspan x="835" dy="21">agar pelanggan dapat melihat dan</tspan><tspan x="835" dy="21">mengevaluasi arah desain.</tspan></text>
<rect x="70" y="382" width="330" height="178" rx="22" fill="#fff" stroke="#9fbd98" stroke-width="2"/><circle cx="125" cy="435" r="27" fill="#edf5e9" stroke="#9fbd98"/><path d="M113 435l8 8 16-18" fill="none" stroke="#315d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="430" font-size="18" fill="#5b8654">03</text><text x="105" y="485" font-size="27" font-weight="bold">Finalisasi Desain</text><text x="105" y="515" font-size="13.5"><tspan x="105" dy="0">Menyempurnakan tampilan berdasarkan</tspan><tspan x="105" dy="20">hasil diskusi dan pratinjau hingga sesuai</tspan><tspan x="105" dy="20">dengan kesepakatan.</tspan></text></g></svg>