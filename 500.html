<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Gangguan Server — NFShark</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=20261105-1">
  <link rel="stylesheet" href="css/error-animation.css">
  <script src="js/error-animation.js" defer></script>
</head>
<body>
  <main class="error-card" data-error-page data-error-code="500" aria-labelledby="error-title">
    <div class="error-stage" data-error-stage>
      <span class="error-decor error-decor--browser" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="error-decor error-decor--document" aria-hidden="true">500</span>
      <span class="error-seaweed error-seaweed--left" aria-hidden="true"></span>
      <span class="error-seaweed error-seaweed--right" aria-hidden="true"></span>
      <button class="error-shark" type="button" aria-label="Maskot hiu NFShark. Klik untuk diperiksa." data-error-shark>
        <span class="error-shark__art" data-error-shark-art></span>
        <svg class="error-shark__lens" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="25" cy="25" r="16" fill="#fff" fill-opacity=".22" stroke="#a8e6c1" stroke-width="5" />
          <path d="m37 37 17 17" fill="none" stroke="#a8e6c1" stroke-linecap="round" stroke-width="7" />
          <path d="m37 37 17 17" fill="none" stroke="#f4f7f4" stroke-linecap="round" stroke-width="2" />
        </svg>
      </button>
      <span class="error-bubble error-bubble--one" aria-hidden="true"></span>
      <span class="error-bubble error-bubble--two" aria-hidden="true"></span>
    </div>
    <div class="error-content">
      <p class="error-code" data-error-code-text aria-label="Kode error 500">500</p>
      <h1 class="intro-item" id="error-title" data-error-title>Terjadi gangguan pada server</h1>
      <p class="intro-item" data-error-description>Halaman ini tidak dapat diproses saat ini. Silakan coba kembali beberapa saat lagi.</p>
      <a class="error-home intro-item" href="/">Kembali ke halaman utama</a>
    </div>
  </main>
  <script src="js/touch-ripple.js" defer></script>
  <script src="js/skeleton-loading.js" defer></script>
</body>
</html>
